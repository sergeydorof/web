<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Task №7</title>
    <style>
        :root {
            --size: 100px;
            --half-size: 50px;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            user-select: none;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }

        #shapeCount {
            width: 150px;
            margin-bottom: 5px;
            padding: 2px;
            border: 1px solid #a9a9a9;
        }

        button {
            padding: 2px 8px;
            border: 1px solid #a9a9a9;
            background-color: #f0f0f0;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .shape {
            position: absolute;
            cursor: pointer;
            opacity: 0.85;
            transition: background-color 0.2s, border-bottom-color 0.2s;
        }

        .square {
            width: var(--size);
            height: var(--size);
            background-color: red;
            border: 1px solid black;
        }

        .circle {
            width: var(--size);
            height: var(--size);
            background-color: green;
            border-radius: 50%;
            border: 1px solid black;
        }

        .triangle {
            width: 0;
            height: 0;
            background-color: transparent;
            border-left: var(--half-size) solid transparent;
            border-right: var(--half-size) solid transparent;
            border-bottom: var(--size) solid blue;
        }

        .square.selected {
            background-color: yellow;
        }

        .circle.selected {
            background-color: yellow;
        }

        .triangle.selected {
            border-bottom-color: yellow;
        }
    </style>
</head>
<body>

<div id="controls">
    <input type="number" id="shapeCount" value="1" min="1"><br>
    <button id="btnSquare">Квадрат</button>
    <button id="btnTriangle">Треугольник</button>
    <button id="btnCircle">Круг</button>
</div>

<div id="canvas"></div>

<script>
    const canvas = document.getElementById('canvas');
    const inputCount = document.getElementById('shapeCount');

    document.getElementById('btnSquare').addEventListener('click', () => generateShapes('square'));
    document.getElementById('btnTriangle').addEventListener('click', () => generateShapes('triangle'));
    document.getElementById('btnCircle').addEventListener('click', () => generateShapes('circle'));

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateShapes(type) {
        let count = parseInt(inputCount.value);
        if (isNaN(count) || count < 1) count = 1;

        const maxWidth = window.innerWidth;
        const maxHeight = window.innerHeight;

        for (let i = 0; i < count; i++) {
            const shape = document.createElement('div');
            shape.classList.add('shape', type);

            const size = getRandomInt(50, 250);

            const x = getRandomInt(0, maxWidth - size);
            const y = getRandomInt(0, maxHeight - size);

            shape.style.setProperty('--size', `${size}px`);
            shape.style.setProperty('--half-size', `${size / 2}px`);

            shape.style.left = `${x}px`;
            shape.style.top = `${y}px`;

            canvas.appendChild(shape);
        }
    }

    canvas.addEventListener('click', (event) => {
        if (event.target.classList.contains('shape')) {
            document.querySelectorAll('.shape').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
        } else {
            document.querySelectorAll('.shape').forEach(el => el.classList.remove('selected'));
        }
    });

    canvas.addEventListener('dblclick', (event) => {
        if (event.target.classList.contains('shape')) {
            event.target.remove();
        }
    });
</script>
</body>
</html>
