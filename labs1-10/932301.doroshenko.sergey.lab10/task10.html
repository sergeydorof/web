<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фокус-покус</title>
    <link rel="stylesheet" href="task10.css">
</head>
<body>
<!-- Занавес -->
<div id="curtain"></div>

<!-- Сцена со всеми объектами (изначально скрыта) -->
<div id="stage">

    <!-- Лампа (теперь без шнурка) -->
    <div id="lamp-container">
        <img src="Lamp.jpg" alt="Лампа" id="lamp">
    </div>

    <!-- Луч света -->
    <div id="light-beam"></div>

    <!-- Объекты сцены, которые видно ТОЛЬКО когда горит свет -->
    <div id="scene-objects">
        <!-- Волшебница -->
        <img src="Magician.jpg" alt="Волшебница" id="magician">

        <!-- Контейнер для фокуса со шляпой -->
        <div id="magic-hat-container">
            <img src="Rabbit.png" alt="Кролик" class="animal visible-animal" id="rabbit">
            <img src="Bird.png" alt="Голубь" class="animal hidden-animal" id="dove">
            <img src="Hat.png" alt="Шляпа" id="hat">
        </div>
    </div>

</div>

<script src="task10.js"></script>
</body>
</html>
