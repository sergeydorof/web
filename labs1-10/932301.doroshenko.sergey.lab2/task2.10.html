<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>task2.10.html</title>
    <style>
        .float-box {
            float: left;
            width: 250px;
            height: 100px;
            background-color: aquamarine;
            margin-left: 10px;   /* Добавлен отступ слева */
            margin-bottom: 10px; /* Добавлен отступ снизу для промежутка между боксами */
            margin-top: 10px;    /* Добавлен отступ сверху для симметрии с левым краем */
        }

        .clear-box {
            clear: both;
            background-color: bisque;
        }
    </style>
</head>
<body>

<div class="float-box">
    It's a float box
</div>

<div class="clear-box">
    It's a box with clear property
</div>

</body>
</html>
